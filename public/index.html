<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>project-radar</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>📡 project-radar</h1>
  <div class="header-right">
    <span id="last-synced" class="muted"></span>
    <button id="sync-btn" class="btn">Sync now</button>
  </div>
</header>
<div id="layout">
  <aside id="sources-panel">
    <h2 class="panel-title">Sources</h2>
    <ul id="sources-list"></ul>
    <p id="sources-note" class="muted"></p>
  </aside>
  <div id="content">
<nav id="currently-on" class="banner hidden">
  <span>Currently on: <strong id="current-name"></strong></span>
  <span id="current-note" class="muted"></span>
</nav>
<main id="view"></main>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
